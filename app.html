<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>RunAtlas — Běžecký atlas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Driver.js (interaktivní tutoriál) -->
  <script src="https://cdn.jsdelivr.net/npm/driver.js@1.0.1/dist/driver.js.iife.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/driver.js@1.0.1/dist/driver.css"/>

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏃</text></svg>">

  <!-- Leaflet Map CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Supabase JS Client v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    html, body { height: 100%; width: 100%; overflow: hidden; background: #121214; color: #e0e0e0; }

    /* Celkový rámec aplikace */
    #app-layout { display: flex; flex-direction: column; width: 100vw; height: 100vh; overflow: hidden; }

    /* Horní průhledná lišta */
    #top-bar {
      height: 52px;
      background: rgba(22, 22, 26, 0.9);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid #2c2c2e;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      z-index: 2000;
      flex-shrink: 0;
    }
    .top-bar-left { display: flex; align-items: center; gap: 14px; font-weight: 800; font-size: 1.15rem; color: #fff; text-decoration: none; }
    .top-bar-left span { color: #007aff; }

    .top-search-input {
      background: #1c1c1e;
      border: 1px solid #3a3a3c;
      border-radius: 8px;
      padding: 7px 14px;
      color: #fff;
      font-size: 0.84rem;
      width: 290px;
      outline: none;
      transition: all 0.2s;
    }
    .top-search-input:focus { border-color: #007aff; width: 340px; }

    .top-bar-right { display: flex; align-items: center; gap: 10px; }

    /* Tělo aplikace */
    #main-body { display: flex; flex: 1; position: relative; overflow: hidden; }

    /* Levý rozbalovací panel (Runalyze Rail) */
    #left-rail {
      width: 56px;
      background: rgba(20, 20, 24, 0.94);
      backdrop-filter: blur(14px);
      border-right: 1px solid #2c2c2e;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 10px 6px;
      transition: width 0.22s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
      white-space: nowrap;
      z-index: 1500;
    }
    #left-rail:hover { width: 205px; box-shadow: 6px 0 24px rgba(0,0,0,0.6); }

    .rail-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 12px;
      border-radius: 8px;
      color: #8e8e93;
      cursor: pointer;
      border: none;
      background: transparent;
      font-size: 0.82rem;
      font-weight: 600;
      transition: all 0.15s;
    }
    .rail-btn:hover, .rail-btn.active { background: #2c2c2e; color: #fff; }
    .rail-btn .rail-icon { font-size: 1.15rem; flex-shrink: 0; }

    /* Mapa */
    #map { flex: 1; height: 100%; background: #1a1a1a; z-index: 1; }

    /* Pravý postranní panel */
    #sidebar {
      width: 430px;
      height: 100%;
      background: #1c1c1e;
      border-left: 1px solid #2c2c2e;
      display: flex;
      flex-direction: column;
      z-index: 2;
    }
    .sidebar-header { padding: 16px 20px; border-bottom: 1px solid #2c2c2e; background: #161618; }
    .sidebar-header h2 { font-size: 1.2rem; font-weight: 700; color: #fff; margin-bottom: 2px; }
    .sidebar-header p { font-size: 0.78rem; color: #8e8e93; }

    .status-boxes { display: flex; gap: 6px; margin-top: 12px; }
    .status-card-btn {
      flex: 1; display: flex; align-items: center; justify-content: space-between;
      padding: 7px 10px; border-radius: 6px; border: 1px solid #2c2c2e; background: #141416;
      color: #777; cursor: pointer; font-size: 0.76rem; font-weight: 600; transition: all 0.2s;
    }
    .status-card-btn.active { background: #2a2a2d; border-color: #444; color: #fff; }
    .status-card-btn .indicator { width: 7px; height: 7px; border-radius: 50%; background: #444; }
    .status-card-btn.active[data-status="done"] .indicator { background: #34c759; box-shadow: 0 0 6px #34c759; }
    .status-card-btn.active[data-status="planned"] .indicator { background: #ff9f0a; box-shadow: 0 0 6px #ff9f0a; }
    .status-card-btn.active[data-status="bucket"] .indicator { background: #5ac8fa; box-shadow: 0 0 6px #5ac8fa; }

    .filters-section { padding: 10px 20px; border-bottom: 1px solid #262628; display: flex; flex-direction: column; gap: 8px; }
    .filter-pills { display: flex; gap: 6px; flex-wrap: wrap; }

    .pill-btn {
      background: #242426; border: 1px solid #333; color: #aaa; padding: 5px 10px;
      border-radius: 6px; font-size: 0.75rem; font-weight: 600; cursor: pointer; transition: all 0.2s;
    }
    .pill-btn:hover { background: #2c2c2e; color: #fff; }
    .pill-btn.active { background: #007aff; color: #fff; border-color: #007aff; }

    #content { padding: 16px 20px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 10px; }

    /* Kartičky položek */
    .race-card {
      background: #242426; border: 1px solid #2c2c2e; border-radius: 8px;
      padding: 12px 14px; cursor: pointer; transition: all 0.2s ease;
    }
    .race-card:hover { background: #2c2c2e; border-color: #007aff; transform: translateY(-1px); }
    .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .card-title { font-size: 0.95rem; font-weight: 600; color: #fff; display: flex; align-items: center; }
    .card-meta { font-size: 0.75rem; color: #aaa; margin-top: 4px; display: flex; gap: 6px; flex-wrap: wrap; }
    
    .badge { display: inline-block; padding: 3px 7px; border-radius: 4px; font-size: 0.68rem; font-weight: 700; text-transform: uppercase; }
    .badge-done { background: rgba(52, 199, 89, 0.2); color: #34c759; }
    .badge-planned { background: rgba(255, 159, 10, 0.2); color: #ff9f0a; }
    .badge-bucket { background: rgba(90, 200, 250, 0.2); color: #5ac8fa; }
    .badge-memorable { background: rgba(175, 82, 222, 0.2); color: #af52de; }

    .open-detail-btn {
      background: #007aff; color: #fff; border: none; padding: 7px 12px; border-radius: 6px;
      font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: background 0.2s;
    }
    .open-detail-btn:hover { background: #0062cc; }

    .back-btn {
      display: inline-flex; align-items: center; gap: 6px; background: #2c2c2e; border: 1px solid #3a3a3c;
      color: #fff; padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; margin-bottom: 12px;
    }

    /* Vlastní špendlík na mapě */
    .custom-race-pin { background: transparent !important; border: none !important; }
    .pin-circle {
      border: 2px solid #fff; border-radius: 50%; display: flex; align-items: center;
      justify-content: center; box-shadow: 0 3px 8px rgba(0,0,0,0.6); transition: transform 0.15s ease;
    }
    .pin-circle:hover { transform: scale(1.18); }

    /* Modály a vyskakovací okna */
    .modal-backdrop {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8);
      backdrop-filter: blur(8px); z-index: 99999; align-items: center; justify-content: center; padding: 20px;
    }
    .modal-card {
      background: #1c1c1e; border: 1px solid #333; border-radius: 16px; padding: 28px;
      max-width: 480px; width: 100%; color: #fff; display: flex; flex-direction: column; gap: 12px;
    }
    .modal-card input, .modal-card select, .modal-card textarea {
      padding: 10px; background: #2c2c2e; border: 1px solid #444; border-radius: 6px; color: #fff; font-size: 0.85rem; outline: none;
    }

    /* Mobilní responzivita */
    @media (max-width: 768px) {
      .top-search-input { display: none; }
      #left-rail {
        position: fixed; bottom: 0; left: 0; right: 0; width: 100% !important; height: 56px;
        flex-direction: row; justify-content: space-around; border-right: none; border-top: 1px solid #2c2c2e; z-index: 3000;
      }
      .rail-btn span:not(.rail-icon) { display: none; }
      #sidebar {
        position: fixed; inset: 52px 0 56px 0; width: 100%; transform: translateY(100%);
        transition: transform 0.25s ease; z-index: 2500;
      }
      #sidebar.mobile-open { transform: translateY(0); }
      #map { width: 100%; height: calc(100vh - 108px); }
    }
  </style>
</head>
<body>

  <!-- ========================================== -->
  <!-- 1. ONBOARDING OVERLAY PRO PRÁZDNÝ ATLAS   -->
  <!-- ========================================== -->
  <div id="onboarding-overlay" class="modal-backdrop">
    <div class="modal-card" style="text-align: center; max-width: 490px; padding: 36px 28px;">
      <div style="font-size: 2.8rem; margin-bottom: 8px;">🗺️</div>
      <h2 style="font-size: 1.55rem; font-weight: 800; margin-bottom: 6px;">Vítej ve svém RunAtlasu!</h2>
      <p style="font-size: 0.9rem; color: #a1a1a6; line-height: 1.5; margin-bottom: 24px;">
        Tvoje mapa je zatím čisté plátno. Nahraj svůj první závod z hodinek, ulož si památný trénink nebo si prohlédni, jak atlas funguje.
      </p>

      <div style="display: flex; flex-direction: column; gap: 10px;">
        <button class="open-detail-btn" style="padding: 13px; font-size: 0.92rem;" onclick="openAddModal('race')">
          🏁 Přidat první závod (Add race)
        </button>
        <button class="open-detail-btn" style="background:#2c2c2e; border:1px solid #444; padding:13px; font-size:0.92rem;" onclick="openAddModal('memorable')">
          🏃 Přidat památný běh (Add memorable run)
        </button>
        <button class="pill-btn" style="padding: 11px; font-size: 0.88rem; justify-content: center;" onclick="startInteractiveTutorial()">
          💡 Ukázat, jak to funguje (See tutorial)
        </button>
      </div>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- 2. FORMULÁŘ: PŘIDÁNÍ ZÁVODU / BĚHU       -->
  <!-- ========================================== -->
  <div id="add-modal" class="modal-backdrop" style="overflow-y: auto;">
    <div class="modal-card">
      <h3 id="add-modal-title" style="font-size: 1.2rem; font-weight: 700;">Přidat novou trasu</h3>

      <!-- Drag & drop GPX -->
      <div id="drop-gpx" style="border: 2px dashed #007aff; border-radius: 8px; padding: 16px; text-align: center; background: rgba(0,122,255,0.08); cursor: pointer;">
        <span id="gpx-label">📁 Přetáhni sem .GPX z hodinek (nebo klikni)</span>
        <input type="file" id="input-gpx" accept=".gpx" style="display: none;" onchange="handleGpxUpload(this.files[0])">
      </div>

      <input id="form-name" type="text" placeholder="Název závodu nebo běhu *">

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
        <input id="form-date" type="text" placeholder="Datum (např. 24. 10. 2026)">
        <select id="form-status">
          <option value="done">Odběhnuto</option>
          <option value="planned">V plánu</option>
          <option value="bucket">Bucket list</option>
        </select>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
        <input id="form-distance" type="text" placeholder="Vzdálenost (spočte GPX)">
        <input id="form-elevation" type="text" placeholder="Převýšení (spočte GPX)">
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
        <select id="form-surface">
          <option value="trail">Trail / Hory</option>
          <option value="road">Silnice / Asfalt</option>
        </select>
        <select id="form-difficulty">
          <option value="snadna">🟢 Snadná</option>
          <option value="stredni">🟡 Střední</option>
          <option value="tezka">🟠 Těžká</option>
          <option value="extremni">🔴 Extrémní</option>
        </select>
      </div>

      <input id="form-why" type="text" placeholder="Moje „proč“ (krátký citát či motivace)">
      <textarea id="form-notes" placeholder="Poznámky k terénu, zážitku, logistice..." style="height: 60px;"></textarea>

      <div>
        <label style="font-size: 0.75rem; color: #aaa; display: block; margin-bottom: 4px;">Fotka ze závodu:</label>
        <input type="file" id="input-image" accept="image/*" style="font-size: 0.8rem; color: #888;">
      </div>

      <button id="btn-save-race" class="open-detail-btn" style="padding: 12px; margin-top: 4px;" onclick="saveRaceToSupabase()">Uložit trasu do atlasu</button>
      <button class="pill-btn" style="align-self: center; justify-content: center;" onclick="closeModals()">Zrušit</button>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- 3. HLAVNÍ ROZLOŽENÍ APLIKACE              -->
  <!-- ========================================== -->
  <div id="app-layout">
    <!-- HORNÍ LIŠTA -->
    <header id="top-bar">
      <a href="index.html" class="top-bar-left">RUN<span>ATLAS</span></a>
      <input type="text" id="global-search" class="top-search-input" placeholder="🔍 Hledat závod, trasu, město..." oninput="handleSearch(this.value)">
      <div class="top-bar-right">
        <button id="btn-add-race" class="open-detail-btn" style="display: none;" onclick="openAddModal('race')">➕ Přidat závod</button>
        <button id="btn-profile" class="pill-btn" onclick="handleProfileClick()">👤 <span id="label-user">Profil</span></button>
      </div>
    </header>

    <!-- HLAVNÍ PLOCHA -->
    <div id="main-body">
      <!-- LEVÝ ROZBALOVACÍ PANEL -->
      <nav id="left-rail">
        <button id="rail-races" class="rail-btn active" onclick="switchMode('races')">
          <span class="rail-icon">🌐</span>
          <span>Běžecký atlas</span>
        </button>
        <button id="rail-memorable" class="rail-btn" onclick="switchMode('memorable')">
          <span class="rail-icon">🏃</span>
          <span>Památné běhy</span>
        </button>
        <div style="height: 1px; background: #2c2c2e; margin: 4px 0;"></div>
        <button class="rail-btn" onclick="map.setView([50.0, 14.5], 5, { animate: true })">
          <span class="rail-icon">🗺️</span>
          <span>Celá Evropa</span>
        </button>
        <button class="rail-btn" onclick="map.setView([30.0, 15.0], 2.5, { animate: true })">
          <span class="rail-icon">🌍</span>
          <span>Celý svět</span>
        </button>
      </nav>

      <!-- MAPA -->
      <div id="map"></div>

      <!-- PRAVÝ PANEL -->
      <aside id="sidebar">
        <div class="sidebar-header">
          <h2 id="main-title">Běžecký atlas</h2>
          <p id="stats-label">Načítám závody...</p>
          <div id="status-boxes-wrap" class="status-boxes">
            <div class="status-card-btn active" data-status="done" onclick="toggleStatusFilter('done')">
              <span>Odběhnuto</span><span class="indicator"></span>
            </div>
            <div class="status-card-btn active" data-status="planned" onclick="toggleStatusFilter('planned')">
              <span>V plánu</span><span class="indicator"></span>
            </div>
            <div class="status-card-btn active" data-status="bucket" onclick="toggleStatusFilter('bucket')">
              <span>Bucket list</span><span class="indicator"></span>
            </div>
          </div>
        </div>

        <!-- RYCHLÉ FILTRY POVRCHU -->
        <div class="filters-section">
          <div class="filter-pills">
            <button class="pill-btn active" onclick="setSurfaceFilter('all', this)">Vše</button>
            <button class="pill-btn" onclick="setSurfaceFilter('trail', this)">Trail / Hory</button>
            <button class="pill-btn" onclick="setSurfaceFilter('road', this)">Silnice / Asfalt</button>
          </div>
        </div>

        <!-- SEZNAM KARET -->
        <div id="content"></div>
      </aside>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- 4. JAVASCRIPT A LOGIKA SUPABASE           -->
  <!-- ========================================== -->
  <script>
    // Konfigurace tvého projektu Supabase
    const SUPABASE_URL = "https://rqnozgpntgauldvpvswd.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJxbm96Z3BudGdhdWxkdnB2c3dkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1MTA0MzUsImV4cCI6MjEwODA4NjQzNX0.TfmHE3zkVgVjupOFLA8_egRGwmVx5BDljHggk3H1ohc";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Globální stavy
    let currentUser = null;
    let currentProfile = null;
    let isDemoMode = false;
    let currentMode = 'races'; // 'races' nebo 'memorable'
    let currentRouteLayer = null;

    let races = [];
    let memorableRuns = [];
    let zavodniTrasy = {}; // Souřadnice linek z GPX

    const statusFilters = { done: true, planned: true, bucket: true };
    let surfaceFilter = 'all';
    let searchQuery = '';

    // Ukázková data POUZE pro demo režim (?demo=true)
    const demoRaces = [
      {
        id: "demo-helsinki", name: "Björn Borg Marathon Helsinki", date: "22. 8. 2026", month: 8,
        coords: [60.155, 24.951], status: "done", statusLabel: "Odběhnuto", surface: "road", surfaceLabel: "Silnice",
        distance: "42.2 km", elevation: "+226 m", difficulty: "stredni",
        why: "První maraton — rovinatá trať podél moře za příjemného severského léta.",
        notes: "Even split po celou dobu, perfektní organizace.", result: "3:11:04",
        image: "https://images.unsplash.com/photo-1538332576228-eb5b4c4de6f5?auto=format&fit=crop&w=800&q=80"
      },
      {
        id: "demo-dresden", name: "Dresden Half Marathon", date: "24. 10. 2026", month: 10,
        coords: [51.050, 13.737], status: "planned", statusLabel: "V plánu", surface: "road", surfaceLabel: "Silnice",
        distance: "21.1 km", elevation: "+110 m", difficulty: "snadna",
        why: "Rychlý asfalt podél Labe kousek od domova, ideální na osobák.",
        notes: "Cílové tempo 4:07 min/km.", result: "Cíl pod 1:27:00",
        image: "https://images.unsplash.com/photo-1513622470522-26c3c8a854bc?auto=format&fit=crop&w=800&q=80"
      },
      {
        id: "demo-chianti", name: "Chianti Ultra Trail", date: "20. 3. 2027", month: 3,
        coords: [43.490, 11.378], status: "planned", statusLabel: "V plánu", surface: "trail", surfaceLabel: "Trail",
        distance: "73 km", elevation: "+3 000 m", difficulty: "tezka",
        why: "Ranní svítání nad toskánskými vinicemi a historická městečka.",
        notes: "Běhavý profil, ale slunce prověří hydrataci.", result: "Dokončit se ctí",
        image: "https://images.unsplash.com/photo-1523348837708-a5d9fc0189fa?auto=format&fit=crop&w=800&q=80"
      },
      {
        id: "demo-nuts", name: "NUTS Karhunkierros", date: "Květen 2027", month: 5,
        coords: [66.368, 29.324], status: "bucket", statusLabel: "Bucket list", surface: "trail", surfaceLabel: "Trail",
        distance: "83 km", elevation: "+1 200 m", difficulty: "tezka",
        why: "Nekonečný polární den v arktické tajze národního parku Oulanka.",
        notes: "Visuté mosty, divoké peřeje a rašeliniště.", result: "Zážitkový bucket list",
        image: "https://images.unsplash.com/photo-1517824806704-9040b037703b?auto=format&fit=crop&w=800&q=80"
      }
    ];

    // ==========================================
    // INICIALIZACE MAPY (Leaflet)
    // ==========================================
    const map = L.map('map', { center: [50.0, 14.5], zoom: 5 });
    const esriTopo = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', { attribution: '&copy; Esri', maxZoom: 18 }).addTo(map);
    const esriDark = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', { attribution: '&copy; Esri Dark', maxZoom: 16 });
    const esriSat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution: '&copy; Esri Satelit', maxZoom: 18 });

    L.control.layers({ "Topografická (výchozí)": esriTopo, "Tmavá mapa": esriDark, "Satelit": esriSat }).addTo(map);
    let markerLayerGroup = L.featureGroup().addTo(map);

    // Domovský bod (Slaný)
    const homeMarker = L.circleMarker([50.2305, 14.0888], {
      radius: 7, fillColor: '#007aff', color: '#fff', weight: 2, fillOpacity: 1
    }).addTo(map).bindTooltip("🏠 Domov (Slaný)", { direction: 'top' });

    // ==========================================
    // AUTORIZACE A NAČTENÍ DAT
    // ==========================================
    async function initApp() {
      const params = new URLSearchParams(window.location.search);
      isDemoMode = params.get('demo') === 'true';
      const sharedUser = params.get('u');

      if (isDemoMode) {
        document.getElementById('label-user').textContent = "Demo účet";
        document.getElementById('main-title').textContent = "Běžecký atlas (Ukázka)";
        races = [...demoRaces];
        renderAll();
        return;
      }

      const { data: { user } } = await supabaseClient.auth.getUser();
      currentUser = user;

      if (currentUser) {
        const { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', currentUser.id).single();
        currentProfile = profile;
        const name = profile?.username || currentUser.email.split('@')[0];
        document.getElementById('label-user').textContent = name;
        document.getElementById('btn-add-race').style.display = 'inline-block';

        await loadRacesFromDB(currentUser.id);
      } else if (sharedUser) {
        const { data: profile } = await supabaseClient.from('profiles').select('*').eq('username', sharedUser).single();
        if (profile) {
          document.getElementById('main-title').textContent = `Atlas: ${profile.display_name || profile.username}`;
          document.getElementById('label-user').textContent = "Host";
          await loadRacesFromDB(profile.id);
        } else {
          alert('Uživatel nebyl nalezen.');
          window.location.href = 'index.html';
        }
      } else {
        window.location.href = 'index.html';
      }
    }

    async function loadRacesFromDB(userId) {
      const { data, error } = await supabaseClient.from('races').select('*').eq('user_id', userId);
      
      if (!error && data && data.length > 0) {
        races = data.map(item => ({
          id: item.id,
          name: item.name,
          date: item.date,
          month: item.month,
          coords: item.coords,
          status: item.status,
          statusLabel: item.status_label,
          surface: item.surface,
          surfaceLabel: item.surface_label,
          difficulty: item.difficulty,
          distance: item.distance,
          elevation: item.elevation,
          why: item.why,
          notes: item.notes,
          image: item.image_url,
          result: item.how_it_went
        }));

        data.forEach(item => {
          if (item.route_coords) zavodniTrasy[item.id] = item.route_coords;
        });

        renderAll();
      } else {
        races = [];
        renderAll();
        // Spolehlivé zobrazení overlaye pro prázdný účet
        setTimeout(() => {
          document.getElementById('onboarding-overlay').style.display = 'flex';
        }, 120);
      }
    }

    // ==========================================
    // VYKRESLENÍ (MAPA + SEZNAM)
    // ==========================================
    function renderAll() {
      markerLayerGroup.clearLayers();
      const content = document.getElementById('content');
      content.innerHTML = '';

      const activeList = (currentMode === 'races' ? races : memorableRuns).filter(item => {
        if (currentMode === 'races' && !statusFilters[item.status]) return false;
        if (surfaceFilter !== 'all' && item.surface !== surfaceFilter) return false;
        if (searchQuery && !item.name.toLowerCase().includes(searchQuery)) return false;
        return true;
      });

      document.getElementById('stats-label').textContent = `Zobrazeno ${activeList.length} položek`;

      if (activeList.length === 0) {
        content.innerHTML = '<div style="color:#777; text-align:center; margin-top:40%; font-size:0.85rem;">Žádný záznam neodpovídá filtrům.</div>';
        return;
      }

      activeList.forEach(item => {
        // 1. Značka na mapě
        const colors = { done: '#34c759', planned: '#ff9f0a', bucket: '#5ac8fa', memorable: '#af52de' };
        const pinColor = colors[item.status] || '#007aff';

        const pinHtml = `<div class="pin-circle" style="width:18px; height:18px; background:${pinColor};"></div>`;
        const icon = L.divIcon({ className: 'custom-race-pin', html: pinHtml, iconSize: [18, 18], iconAnchor: [9, 9] });

        const marker = L.marker(item.coords, { icon: icon }).addTo(markerLayerGroup);
        marker.bindTooltip(`<b>${item.name}</b><br>${item.distance} &bull; ${item.surfaceLabel}`);
        marker.on('click', () => showDetail(item));

        // 2. Kartička v sidebaru
        const card = document.createElement('div');
        card.className = 'race-card';
        card.innerHTML = `
          <div class="card-top">
            <span class="badge badge-${item.status}">${item.statusLabel || item.status}</span>
            <span style="font-size:0.75rem; color:#888;">${item.date || ''}</span>
          </div>
          <div class="card-title">${item.name}</div>
          <div class="card-meta">
            <span>🏃 ${item.surfaceLabel}</span><span>&bull;</span>
            <span>📏 ${item.distance}</span><span>&bull;</span>
            <span>⛰️ ${item.elevation}</span>
          </div>
        `;
        card.onclick = () => {
          showDetail(item);
          map.panTo(item.coords, { animate: true });
        };
        content.appendChild(card);
      });
    }

    // ==========================================
    // DETAIL POLOŽKY A VYKRESLENÍ TRASY
    // ==========================================
    function showDetail(item) {
      if (currentRouteLayer) { map.removeLayer(currentRouteLayer); currentRouteLayer = null; }

      const content = document.getElementById('content');
      const photoHtml = item.image ? `<img src="${item.image}" style="width:100%; max-height:220px; object-fit:cover; border-radius:8px; margin-bottom:10px;">` : '';

      content.innerHTML = `
        <button class="back-btn" onclick="renderAll()">← Zpět na seznam</button>
        ${photoHtml}
        <h2 style="font-size:1.25rem; font-weight:700; color:#fff; margin-bottom:6px;">${item.name}</h2>
        <div style="font-size:0.8rem; color:#aaa; margin-bottom:12px;">📅 ${item.date || 'Bez data'} &bull; ${item.surfaceLabel}</div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; background:#242426; padding:12px; border-radius:8px; margin-bottom:12px;">
          <div><small style="color:#777; font-size:0.7rem; display:block;">VZDÁLENOST</small><strong>${item.distance}</strong></div>
          <div><small style="color:#777; font-size:0.7rem; display:block;">PŘEVÝŠENÍ</small><strong>${item.elevation}</strong></div>
        </div>

        ${item.why ? `<div style="background:#1f2733; border-left:3px solid #007aff; padding:10px; border-radius:6px; font-size:0.84rem; margin-bottom:10px;"><em>„${item.why}“</em></div>` : ''}
        ${item.notes ? `<div style="background:#242426; padding:10px; border-radius:6px; font-size:0.8rem; color:#bbb;">${item.notes}</div>` : ''}
      `;

      // Kreslení křivky trasy z GPX
      if (zavodniTrasy[item.id]) {
        const coords = zavodniTrasy[item.id];
        currentRouteLayer = L.featureGroup([
          L.polyline(coords, { color: '#007aff', weight: 4 }),
          L.circleMarker(coords[0], { radius: 6, fillColor: '#34c759', color: '#fff', weight: 2, fillOpacity: 1 }).bindTooltip("Start"),
          L.circleMarker(coords[coords.length - 1], { radius: 6, fillColor: '#ff3b30', color: '#fff', weight: 2, fillOpacity: 1 }).bindTooltip("Cíl")
        ]).addTo(map);
        map.fitBounds(currentRouteLayer.getBounds(), { padding: [40, 40] });
      }
    }

    // ==========================================
    // FILTRY A VYHLEDÁVÁNÍ
    // ==========================================
    function toggleStatusFilter(statusKey) {
      statusFilters[statusKey] = !statusFilters[statusKey];
      document.querySelector(`.status-card-btn[data-status="${statusKey}"]`).classList.toggle('active', statusFilters[statusKey]);
      renderAll();
    }

    function setSurfaceFilter(surface, btn) {
      surfaceFilter = surface;
      document.querySelectorAll('.filter-pills .pill-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderAll();
    }

    function handleSearch(val) {
      searchQuery = val.trim().toLowerCase();
      renderAll();
    }

    function switchMode(mode) {
      currentMode = mode;
      document.getElementById('rail-races').classList.toggle('active', mode === 'races');
      document.getElementById('rail-memorable').classList.toggle('active', mode === 'memorable');
      document.getElementById('status-boxes-wrap').style.display = mode === 'races' ? 'flex' : 'none';
      document.getElementById('main-title').textContent = mode === 'races' ? 'Běžecký atlas' : 'Památné běhy';
      renderAll();
    }

    // ==========================================
    // NAHRÁVÁNÍ NOVÉHO ZÁVODU & GPX PARSER
    // ==========================================
    let parsedGpxCoords = null;
    let parsedCenterCoords = null;

    function openAddModal(type = 'race') {
      closeModals();
      document.getElementById('add-modal').style.display = 'flex';
      document.getElementById('add-modal-title').textContent = type === 'memorable' ? 'Přidat památný běh' : 'Přidat nový závod';
    }

    function closeModals() {
      document.getElementById('onboarding-overlay').style.display = 'none';
      document.getElementById('add-modal').style.display = 'none';
    }

    document.getElementById('drop-gpx').addEventListener('click', () => {
      document.getElementById('input-gpx').click();
    });

    function handleGpxUpload(file) {
      if (!file) return;
      document.getElementById('gpx-label').textContent = 'Načítám: ' + file.name;

      const reader = new FileReader();
      reader.onload = function(e) {
        const parser = new DOMParser();
        const xml = parser.parseFromString(e.target.result, 'text/xml');
        const trkpts = xml.querySelectorAll('trkpt');

        if (trkpts.length === 0) {
          alert('V GPX souboru nebyly nalezeny body trasy.');
          return;
        }

        let latlngs = [];
        let totalDist = 0;
        let totalEle = 0;
        let prevEle = null;

        for (let i = 0; i < trkpts.length; i++) {
          const lat = parseFloat(trkpts[i].getAttribute('lat'));
          const lon = parseFloat(trkpts[i].getAttribute('lon'));
          latlngs.push([lat, lon]);

          const eleEl = trkpts[i].querySelector('ele');
          if (eleEl) {
            const ele = parseFloat(eleEl.textContent);
            if (prevEle !== null && ele > prevEle) totalEle += (ele - prevEle);
            prevEle = ele;
          }

          if (i > 0) {
            const prev = latlngs[i - 1];
            const rad = Math.PI / 180;
            const dLat = (lat - prev[0]) * rad;
            const dLon = (lon - prev[1]) * rad;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(prev[0] * rad) * Math.cos(lat * rad) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
            totalDist += 6371 * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
          }
        }

        parsedGpxCoords = latlngs;
        parsedCenterCoords = latlngs[0];

        document.getElementById('form-distance').value = totalDist.toFixed(1) + ' km';
        document.getElementById('form-elevation').value = '+' + Math.round(totalEle) + ' m';
        document.getElementById('gpx-label').textContent = `✅ Načteno (${latlngs.length} bodů, ${totalDist.toFixed(1)} km)`;
      };
      reader.readAsText(file);
    }

    async function saveRaceToSupabase() {
      if (!currentUser) return;
      const name = document.getElementById('form-name').value.trim();
      if (!name) { alert('Vyplň prosím název.'); return; }
      if (!parsedCenterCoords) { alert('Nahraj prosím GPX soubor s trasou.'); return; }

      const btn = document.getElementById('btn-save-race');
      btn.textContent = 'Ukládám do cloudu...';
      btn.disabled = true;

      try {
        let imageUrl = '';
        const imageFile = document.getElementById('input-image').files[0];
        if (imageFile) {
          const fileExt = imageFile.name.split('.').pop();
          const filePath = `${currentUser.id}/${Date.now()}.${fileExt}`;
          const { error: uploadErr } = await supabaseClient.storage.from('race-images').upload(filePath, imageFile);
          if (!uploadErr) {
            const { data: { publicUrl } } = supabaseClient.storage.from('race-images').getPublicUrl(filePath);
            imageUrl = publicUrl;
          }
        }

        const dateStr = document.getElementById('form-date').value.trim();
        const parts = dateStr.split('.');
        const month = parts.length >= 2 ? parseInt(parts[1].trim()) : 1;

        const record = {
          user_id: currentUser.id,
          name: name,
          date: dateStr,
          month: month,
          status: document.getElementById('form-status').value,
          status_label: document.getElementById('form-status').options[document.getElementById('form-status').selectedIndex].text,
          surface: document.getElementById('form-surface').value,
          surface_label: document.getElementById('form-surface').options[document.getElementById('form-surface').selectedIndex].text,
          difficulty: document.getElementById('form-difficulty').value,
          distance: document.getElementById('form-distance').value,
          elevation: document.getElementById('form-elevation').value,
          why: document.getElementById('form-why').value,
          notes: document.getElementById('form-notes').value,
          image_url: imageUrl,
          coords: parsedCenterCoords,
          route_coords: parsedGpxCoords
        };

        const { error: insertErr } = await supabaseClient.from('races').insert([record]);
        if (insertErr) throw insertErr;

        alert('Trasa byla úspěšně uložena!');
        closeModals();
        await loadRacesFromDB(currentUser.id);
      } catch (err) {
        alert('Chyba: ' + err.message);
      } finally {
        btn.textContent = 'Uložit trasu do atlasu';
        btn.disabled = false;
      }
    }

    // ==========================================
    // INTERAKTIVNÍ TUTORIÁL (Driver.js)
    // ==========================================
    function startInteractiveTutorial() {
      closeModals();
      const driverObj = window.driver.js.driver({
        showProgress: true,
        animate: true,
        nextBtnText: 'Další ➔',
        prevBtnText: '⬅ Zpět',
        doneBtnText: 'Hotovo, jdeme běhat!',
        steps: [
          { element: '#left-rail', popover: { title: 'Navigace', description: 'Tady přepínáš mezi oficiálními Závody a Památnými běhy.', side: "right" } },
          { element: '#global-search', popover: { title: 'Rychlé hledání', description: 'Filtruj trasy podle názvu, měst nebo pohoří.', side: "bottom" } },
          { element: '#btn-add-race', popover: { title: 'Nahrání trasy', description: 'Přetáhni sem .GPX ze svých hodinek a fotku z mobilu.', side: "bottom" } },
          { element: '#sidebar', popover: { title: 'Seznam a filtrace', description: 'Kliknutím na kartu v seznamu se vycentruje mapa a vykreslí profil trasy.', side: "left" } }
        ]
      });
      driverObj.drive();
    }

    function handleProfileClick() {
      if (isDemoMode) { window.location.href = 'index.html'; return; }
      if (confirm('Chceš se odhlásit z atlasu?')) {
        supabaseClient.auth.signOut().then(() => { window.location.href = 'index.html'; });
      }
    }

    // Start aplikace
    initApp();
  </script>
