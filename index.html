<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Running Atlas — Interactive Map & Route Log</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Favicon: Running Atlas Topo-Peak -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23121214'/%3E%3Cpath d='M32 8 L8 54 L20 54 L32 28 L44 54 L56 54 Z' fill='%23007aff'/%3E%3Cpath d='M4 36 Q18 26 32 33 T60 30' stroke='%23ffffff' stroke-width='3.5' stroke-linecap='round' fill='none'/%3E%3Cpath d='M6 44 Q19 35 32 41 T58 38' stroke='%235ac8fa' stroke-width='3' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">

  <!-- Supabase JS Client v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    html, body { height: 100%; width: 100%; overflow: hidden; background: #0c0c0e; color: #f2f2f7; }

    /* Video pozadí s lokálním souborem hero.mp4 */
    #bg-video-wrap {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 1;
    }
    #bg-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.42;
      filter: saturate(1.1) brightness(0.85);
    }
    .video-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(12, 12, 14, 0.4) 0%, rgba(12, 12, 14, 0.88) 100%);
    }

    /* Hlavní kontejner */
    .hero-container {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }

    .hero-title {
      font-size: 2.7rem;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 28px;
      letter-spacing: -0.8px;
      color: #ffffff;
      max-width: 760px;
    }
    .hero-title span {
      color: #007aff;
    }

    /* Tlačítka svisle pod sebou */
    .hero-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 320px;
    }

    .btn-primary {
      background: #007aff;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 700;
      padding: 14px 24px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-primary:hover {
      background: #0062cc;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 122, 255, 0.35);
    }

    .btn-secondary {
      background: rgba(36, 36, 40, 0.85);
      backdrop-filter: blur(8px);
      color: #f2f2f7;
      font-size: 0.92rem;
      font-weight: 600;
      padding: 13px 24px;
      border-radius: 12px;
      border: 1px solid #3a3a3c;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-secondary:hover {
      background: #3a3a3c;
      transform: translateY(-2px);
    }

    .hero-footer {
      position: absolute;
      bottom: 16px;
      font-size: 0.78rem;
      color: #636366;
      text-align: center;
      z-index: 2;
    }

    /* Auth modal */
    .auth-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .auth-card {
      background: #1c1c1e;
      border: 1px solid #38383a;
      border-radius: 20px;
      padding: 32px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 24px 60px rgba(0,0,0,0.85);
      color: #fff;
    }
    .auth-input {
      width: 100%;
      padding: 12px 14px;
      background: #242426;
      border: 1px solid #3a3a3c;
      border-radius: 8px;
      color: #fff;
      font-size: 0.9rem;
      margin-bottom: 12px;
      outline: none;
    }
    .auth-input:focus { border-color: #007aff; }

    @media (max-width: 600px) {
      .hero-title { font-size: 2rem; }
    }
  </style>
</head>
<body>

  <!-- Lokální video z repozitáře: hero.mp4 -->
  <div id="bg-video-wrap">
    <video id="bg-video" autoplay loop muted playsinline>
      <source src="hero.mp4" type="video/mp4">
    </video>
    <div class="video-overlay"></div>
  </div>

  <main class="hero-container">
    <!-- HIERARCHICKÉ LOGO RUNNING ATLAS -->
    <div class="brand-logo" style="margin-bottom: 24px; display: inline-flex; justify-content: center; width: 100%;">
      <svg width="390" height="130" viewBox="0 0 380 125" fill="none" xmlns="http://www.w3.org/2000/svg" style="max-width: 100%; height: auto; overflow: visible;">
        <defs>
          <filter id="heroRidgeGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="2" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
          </filter>
        </defs>

        <!-- Horní nápis: RUNNING -->
        <text x="8" y="22" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" letter-spacing="8">RUNNING</text>

        <!-- Masiv hory a písmeno A -->
        <g transform="translate(6, 36)">
          <path d="M 32 0 L 0 54 L 14 54 L 32 23 L 50 54 L 64 54 Z" fill="#007aff"/>
          <path d="M -6 32 Q 13 20 32 29 T 70 26" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" fill="none" filter="url(#heroRidgeGlow)"/>
          <path d="M -4 42 Q 14 31 32 39 T 68 36" stroke="#5ac8fa" stroke-width="3" stroke-linecap="round" fill="none"/>
        </g>

        <!-- Nápis TLAS -->
        <text x="77" y="86" fill="#007aff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="62" font-weight="900" letter-spacing="2">TLAS</text>

        <!-- Spodní linka profilu s body -->
        <path d="M 6 102 L 205 102 L 216 95 L 225 106 L 235 89 L 246 102 L 368 102" stroke="#007aff" stroke-width="2" stroke-opacity="0.45" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="6" cy="102" r="3.5" fill="#34c759"/>
        <circle cx="368" cy="102" r="3.5" fill="#ff3b30"/>
      </svg>
    </div>

    <!-- Správně rozložený nadpis na 2 řádky -->
    <h1 class="hero-title">All your running footsteps<br>on a <span>single map</span></h1>

    <!-- Tlačítka pod sebou -->
    <div class="hero-actions">
      <button class="btn-primary" onclick="openAuthModal('signup')">Create Free Atlas</button>
      <button class="btn-secondary" onclick="openAuthModal('signin')">Sign In</button>
      <a class="btn-secondary" href="app.html?demo=true">Try Live Demo ➔</a>
    </div>

    <footer class="hero-footer">
      &copy; 2026 Running Atlas. All rights reserved.
    </footer>
  </main>

  <!-- AUTH MODAL -->
  <div id="auth-modal" class="auth-modal">
    <div class="auth-card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:18px;">
        <h3 id="auth-title" style="font-size:1.3rem; font-weight:800;">Sign In</h3>
        <button onclick="closeAuthModal()" style="background:transparent; border:none; color:#888; font-size:1.5rem; cursor:pointer;">&times;</button>
      </div>

      <input id="auth-email" class="auth-input" type="email" placeholder="Email address">
      <input id="auth-pass" class="auth-input" type="password" placeholder="Password (min 6 characters)">

      <button id="btn-auth-submit" class="btn-primary" style="width:100%; justify-content:center; margin-top:6px;" onclick="handleAuthSubmit()">
        Sign In
      </button>

      <div style="margin-top:16px; text-align:center; font-size:0.84rem; color:#8e8e93;">
        <span id="auth-switch-text">Don't have an account yet?</span>
        <a href="javascript:void(0)" id="auth-switch-link" style="color:#007aff; font-weight:600; text-decoration:none; margin-left:4px;" onclick="toggleAuthMode()">Sign up</a>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://rqnozgpntgauldvpvswd.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJxbm96Z3BudGdhdWxkdnB2c3dkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1MTA0MzUsImV4cCI6MjEwODA4NjQzNX0.TfmHE3zkVgVjupOFLA8_egRGwmVx5BDljHggk3H1ohc";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let authMode = 'signin';

    function openAuthModal(mode = 'signin') {
      authMode = mode;
      document.getElementById('auth-modal').style.display = 'flex';
      const isUp = (mode === 'signup');
      document.getElementById('auth-title').textContent = isUp ? 'Create Your Atlas' : 'Welcome Back';
      document.getElementById('btn-auth-submit').textContent = isUp ? 'Create Free Account' : 'Sign In';
      document.getElementById('auth-switch-text').textContent = isUp ? 'Already have an account?' : "Don't have an account yet?";
      document.getElementById('auth-switch-link').textContent = isUp ? 'Sign In' : 'Sign Up';
    }

    function closeAuthModal() {
      document.getElementById('auth-modal').style.display = 'none';
    }

    function toggleAuthMode() {
      openAuthModal(authMode === 'signin' ? 'signup' : 'signin');
    }

    async function handleAuthSubmit() {
      const email = document.getElementById('auth-email').value.trim();
      const password = document.getElementById('auth-pass').value.trim();

      if (!email || !password) {
        alert('Please fill in both email and password.');
        return;
      }

      const btn = document.getElementById('btn-auth-submit');
      btn.textContent = 'Authenticating...';
      btn.disabled = true;

      try {
        if (authMode === 'signup') {
          const { data, error } = await supabaseClient.auth.signUp({ email, password });
          if (error) throw error;
          alert('Registration successful! Logging into your atlas...');
          window.location.href = 'app.html';
        } else {
          const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
          if (error) throw error;
          window.location.href = 'app.html';
        }
      } catch (err) {
        alert('Auth Error: ' + err.message);
      } finally {
        btn.textContent = (authMode === 'signup') ? 'Create Free Account' : 'Sign In';
        btn.disabled = false;
      }
    }

    supabaseClient.auth.getUser().then(({ data: { user } }) => {
      if (user) window.location.href = 'app.html';
    });
  </script>
</body>
</html>
